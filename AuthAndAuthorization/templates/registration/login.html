<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration / Login</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --panel-alt: #f8fafc;
            --primary: #2f5d8a;
            --primary-dark: #234a72;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #dfe7f1;
            --danger: #b91c1c;
            --shadow: 0 14px 32px rgba(31, 41, 55, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef4ff, var(--bg));
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            padding: 24px;
        }

        .auth-shell {
            width: min(100%, 980px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
        }

        .promo {
            background: linear-gradient(160deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 52px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .promo h1 {
            margin: 0 0 16px;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.1;
        }

        .promo p {
            margin: 0;
            font-size: 1.02rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.9);
            max-width: 420px;
        }

        .card {
            padding: 40px 32px;
            background: var(--panel-alt);
        }

        .tab-row {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
            background: #eef2f8;
            padding: 6px;
            border-radius: 10px;
        }

        .tab {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
        }

        .tab.active {
            background: #fff;
            color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(31, 41, 55, 0.08);
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text);
        }

        input {
            width: 100%;
            height: 46px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0 14px;
            background: #fff;
            font-size: 1rem;
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: rgba(47, 93, 138, 0.65);
            box-shadow: 0 0 0 3px rgba(47, 93, 138, 0.12);
        }

        .btn {
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            height: 48px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .alt-text {
            margin-top: 14px;
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .alt-text a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 700;
        }

        .errorlist {
            margin: 0;
            padding-left: 18px;
            color: var(--danger);
            font-size: 0.85rem;
        }

        @media (max-width: 760px) {
            .auth-shell {
                grid-template-columns: 1fr;
            }

            .promo {
                padding: 32px 24px;
            }

            .card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <aside class="promo">
            <h1>Welcome back.</h1>
            <p>Access your notes, manage your account, and stay organized with a secure and simple login experience.</p>
        </aside>

        <section class="card">
            <div class="tab-row" aria-label="Authentication tabs">
                <button type="button" class="tab active" data-target="login-panel">Login</button>
                <button type="button" class="tab" data-target="register-panel">Register</button>
            </div>

            <div id="login-panel" class="panel active">
                <form method="post">
                    {% csrf_token %}
                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn">Login</button>
                </form>
            </div>

            <div id="register-panel" class="panel">
                <form method="post">
                    {% csrf_token %}
                    <div class="field">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" name="register_username" placeholder="Choose a username" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="field">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" name="register_password" placeholder="Create a password" required>
                    </div>

                    <div class="field">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Repeat your password" required>
                    </div>

                    <button type="submit" class="btn">Create Account</button>
                </form>
            </div>

            <p class="alt-text">Need help? <a href="#">Contact support</a></p>
        </section>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(item => item.classList.toggle('active', item === tab));
                panels.forEach(panel => panel.classList.toggle('active', panel.id === tab.dataset.target));
            });
        });
    </script>
</body>
</html>
